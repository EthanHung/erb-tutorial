<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交Project時要做以下事項</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
    <ul class="list-group">
        <li class="list-group-item">
            <div class="fs-1 fw-bold text-decoration-underline text-primary">交Project時要做以下事項</div>
        </li>
        <li class="list-group-item">
            <div class="fs-3">KEEP返2 個檔案</div>
            <ul class="list-group">
                <li class="list-group-item"><code>package.json</code></li>
                <li class="list-group-item"><code>package-lock.json</code></li>
              </ul>
        </li>
        <li class="list-group-item">
            <div class="fs-3">delete <code>node_modules</code> 資料夾</div>
        </li>
        <li class="list-group-item">
        </li>
        <li class="list-group-item">
            <div class="fs-1 fw-bold text-decoration-underline text-primary">記得加以下資料係PPT到</div>
            <ul class="list-group">
                <li class="list-group-item">教人開CMD</li>
                <li class="list-group-item">係CMD 去返相應既PATH</li>
                <li class="list-group-item">係CMD 行 <code>npm i</code></li>
                <li class="list-group-item">係CMD 行 <code>npm run dev</code></li>
                <li class="list-group-item">有需要再教人開多個CMD行其他program, 例如係json-server</li>
              </ul>
        </li>
      </ul>
</body>
</html>
